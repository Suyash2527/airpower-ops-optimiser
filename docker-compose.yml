services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # PostgreSQL via psycopg (docs/DECISIONS.md D-34). Not yet built end-to-end (Task 8.5).
      AIRPOWER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-airpower}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-airpower}
      AIRPOWER_SCENARIO_DIR: /scenarios
      AIRPOWER_SOLVER_TIME_LIMIT_S: ${AIRPOWER_SOLVER_TIME_LIMIT_S:-20}
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airpower}
      POSTGRES_USER: ${POSTGRES_USER:-airpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
