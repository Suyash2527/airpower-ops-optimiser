[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airpower-backend"
version = "0.1.0"
description = "AirPower: advisory decision-support prototype (synthetic data only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlmodel>=0.0.16",
    "ortools>=9.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "pyyaml>=6",  # objective weight presets (D-52)
    "psycopg[binary]>=3.1",  # hosted PostgreSQL in deployment (D-70); SQLite stays the dev default
]

[project.optional-dependencies]
postgres = []  # kept for compatibility: psycopg is now a main dependency (D-70)
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]  # FastAPI `Depends(...)` defaults
"tests/*.py" = ["E501"]  # long fixture/assertion lines (D-49)
